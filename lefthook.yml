pre-commit:
  jobs:
    - name: format
      group:
        jobs:
          - name: prettier
            run: pnpm exec prettier --write --ignore-unknown --log-level warn {staged_files}
            stage_fixed: true
          - name: biome
            run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
            stage_fixed: true

    - name: lint
      group:
        parallel: true
        jobs:
          - name: typescript
            glob: '*.{ts,tsx}'
            run: pnpm run check:ts
          - name: eslint
            glob: '*.{js,jsx,cjs,mjs,ts,tsx}'
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true
          - name: stylelint
            glob: '*.{css,scss}'
            run: pnpm exec stylelint --fix {staged_files}
            stage_fixed: true
